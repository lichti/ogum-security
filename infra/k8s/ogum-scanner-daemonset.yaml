apiVersion: v1
kind: Namespace
metadata:
  name: ogum-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogum-scanner
  namespace: ogum-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ogum-scanner
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # No access to secrets, configmaps, volumes, or any sensitive data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ogum-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ogum-scanner
subjects:
  - kind: ServiceAccount
    name: ogum-scanner
    namespace: ogum-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ogum-scanner
  namespace: ogum-system
  labels:
    app: ogum-scanner
spec:
  selector:
    matchLabels:
      app: ogum-scanner
  template:
    metadata:
      labels:
        app: ogum-scanner
    spec:
      serviceAccountName: ogum-scanner
      hostPID: true        # required to see /proc/<PID> of other containers
      hostNetwork: false   # no host network exposure
      containers:
        - name: scanner
          image: ogum-scanner:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true              # required for /proc/<PID>/root access
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: OGUM_BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: ogum-scanner-config
                  key: backend_url
            - name: OGUM_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: ogum-scanner-config
                  key: tenant_id
            - name: OGUM_SCANNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ogum-scanner-config
                  key: scanner_token
            - name: TRIVY_SERVER_URL
              value: "http://trivy-server.ogum-system.svc.cluster.local:4954"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: tmp
          emptyDir: {}
      tolerations:
        - operator: Exists  # run on all nodes including tainted ones
