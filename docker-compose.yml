name: ogum-security

# US-13.12: imagens terceiras pinadas por digest; docker.sock removido do
# worker (nenhum código o usa — side-scanning é EBS Direct API + trivy).
services:

  # ── ArangoDB — Graph Database ─────────────────────────────────────────────
  arangodb:
    image: arangodb:3.12@sha256:5b734c1ac7a68e0a7de8b28e043a7354a255854a93deaf9095496b9079044d21
    container_name: ogum-arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-changeme}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8529"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Redis — Task Queue & Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    container_name: ogum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15@sha256:fea7f528068fbb458307f54eb2cc1141be77f7603f0ac36e33f17ea4a25e392d
    container_name: ogum-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ogum-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    restart: unless-stopped

  # ── Redpanda — Kafka-compatible Message Broker ────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.1@sha256:ba665359a21fd22583d8a91e5461ce5799c6c0c2fff2cdf0935242d9e0ca6238
    container_name: ogum-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant — Vector DB for RAG ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0@sha256:22a2d455837380d5fa1a3455b87b4fe7af30aa4f4712f8a57027c61022113796
    container_name: ogum-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Ollama — Local LLM for Ogum.AI ───────────────────────────────────────
  ollama:
    image: ollama/ollama@sha256:4be1eaabf0dd0152bfbb780347e2888b5fe86ec25d0faa3eb4b1a956173736fb
    container_name: ogum-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Trivy Server — Shared Vulnerability DB (EBS Direct API sidecar) ─────
  trivy-server:
    image: aquasec/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
    container_name: ogum-trivy-server
    command: server --listen 0.0.0.0:4954
    ports:
      - "4954:4954"
    volumes:
      - trivy-cache:/root/.cache/trivy
    environment:
      - TRIVY_CACHE_BACKEND=fs
    healthcheck:
      test: ["CMD", "trivy", "server", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Backend — FastAPI ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ogum-backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - ARANGO_HOST=arangodb
      - ARANGO_PORT=8529
      - ARANGO_DB=${ARANGO_DB:-ogum_security}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:-changeme}
      - REDIS_URL=redis://redis:6379/0
      - REDPANDA_BROKERS=redpanda:9092
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:instruct}
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      arangodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Swagger UI — API Reference (no other service required) ──────────────
  swagger-ui:
    image: swaggerapi/swagger-ui@sha256:11c12fc0140d391836f03e2bdcc3fd220f58861b172c1a8c41b60532c25a397b
    container_name: ogum-swagger-ui
    ports:
      - "8085:8080"
    environment:
      - SWAGGER_JSON=/openapi.json
    volumes:
      - ./docs/api/openapi.json:/openapi.json:ro
    restart: unless-stopped

  # ── Celery Worker — Scan Jobs ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ogum-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - APP_ENV=${APP_ENV:-development}
      - ARANGO_HOST=arangodb
      - ARANGO_PORT=8529
      - ARANGO_DB=${ARANGO_DB:-ogum_security}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:-changeme}
      - REDIS_URL=redis://redis:6379/0
      - REDPANDA_BROKERS=redpanda:9092
      - TRIVY_SERVER_URL=http://trivy-server:4954
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - arangodb
      - trivy-server
    restart: unless-stopped

  # ── Celery Beat — Discovery Scheduler ────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ogum-celery-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - APP_ENV=${APP_ENV:-development}
      - ARANGO_HOST=arangodb
      - ARANGO_PORT=8529
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:-changeme}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  # ── Frontend — Next.js ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    # Dev: a imagem tem CMD de produção (node server.js, standalone) — o
    # perfil local sobrecarrega com npm run dev + bind mounts (US-13.12).
    command: npm run dev
    container_name: ogum-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  arangodb_data:
  redis_data:
  redpanda_data:
  qdrant_data:
  ollama_data:
  trivy-cache:
