[tool.poetry]
name = "ogum-security-backend"
version = "0.1.0"
description = "Ogum Security — Open CNAPP Backend"
authors = ["Ogum Security Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-arango = "^8.1.0"
redis = { extras = ["hiredis"], version = "^5.2.0" }
celery = { extras = ["redis"], version = "^5.4.0" }
confluent-kafka = "^2.6.0"
prowler = "^5.31.0"
checkov = "^3.2.0"
httpx = "^0.27.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
langchain = "^0.3.0"
langchain-community = "^0.3.0"
qdrant-client = "^1.12.0"
ollama = "^0.3.0"
truffleHog3 = "^3.0.0"
boto3 = "^1.35.0"
azure-identity = "^1.19.0"
azure-mgmt-security = "^6.0.0"
google-cloud-securitycenter = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
moto = { extras = ["ec2", "iam", "s3", "rds", "lambda", "eks", "kms", "secretsmanager"], version = "^5.0.0" }
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests requiring real ArangoDB and Redis via Docker",
    "security: tenant isolation and auth enforcement — always run in CI, always blocking",
    "e2e: full-stack browser tests via Playwright",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/migrations/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
