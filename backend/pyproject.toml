[tool.poetry]
name = "ogum-security-backend"
version = "0.2.0"
description = "Ogum Security — Open CNAPP Backend"
authors = ["Ogum Security Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.138.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0,<0.53.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-arango = "^8.1.0"
redis = { extras = ["hiredis"], version = ">=5.2.0,<7.0.0" }
celery = { extras = ["redis"], version = "^5.4.0" }
confluent-kafka = "^2.6.0"
prowler = "^5.31.0"
checkov = "^3.2.0"
httpx = "^0.27.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
langchain = "^1.3.9"
langchain-community = "^0.4.0"
qdrant-client = "^1.12.0"
ollama = "^0.3.0"
boto3 = "^1.35.0"
google-cloud-compute = "^1.19.0"
google-cloud-container = "^2.52.0"
google-cloud-storage = "^2.18.0"
google-auth = "^2.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
pytest-mock = "^3.14.0"
moto = { extras = ["ec2", "iam", "s3", "rds", "lambda", "eks", "kms", "secretsmanager"], version = "^5.0.0" }
httpx = "^0.27.0"
ruff = ">=0.11.0,<0.16.0"
mypy = ">=1.13.0,<3.0.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# strict = true is the goal; disabled for now because:
# - Celery @app.task decorator is untyped → untyped-decorator on every task file
# - GCP SDK has no stubs → no-untyped-call
# Enabling strict incrementally as stubs and annotations are added
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
# python-arango stubs return overly broad unions (Cursor | AsyncJob | BatchJob | None)
# causing false positives for union-attr, arg-type and index throughout the codebase
disable_error_code = ["union-attr", "arg-type", "index", "dict-item"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests requiring real ArangoDB and Redis via Docker",
    "security: tenant isolation and auth enforcement — always run in CI, always blocking",
    "e2e: full-stack browser tests via Playwright",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/migrations/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
