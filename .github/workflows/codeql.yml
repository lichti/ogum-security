name: CodeQL

# US-13.11 — SAST do próprio Ogum (o CNAPP escaneia a si mesmo).
# Semanal + em PRs para main; resultados no tab Security do GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # segundas 05:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: backend
          - language: javascript-typescript
            paths: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          # Advanced setup não roda a query de supressão por default — sem ela,
          # supressões inline `# codeql[...]` não são honradas e o gate de PR
          # conta falsos positivos suprimidos como alertas novos.
          queries: ${{ matrix.language == 'python' && '+codeql/python-queries:AlertSuppression.ql' || '' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
