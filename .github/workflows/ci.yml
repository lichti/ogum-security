name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Fast jobs (lint, unit tests, frontend, agent) run on every push to `dev` and `main`,
# and on every PR into `main`. Heavy jobs (Docker build, integration/security tests
# against real ArangoDB+Redis, OpenAPI drift, dependency audit) carry
# `if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'` so a
# push to `dev` (local feature branches merging in) skips them — the full matrix still
# runs once per batched dev → main PR. See ADR-014 in specs/architecture.md.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker — Compose Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/**', 'backend/pyproject.toml', 'frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Validate docker compose build
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1
          BUILDX_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          BUILDX_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Lint (ruff)
        working-directory: backend
        run: poetry run ruff check .

      - name: Format check (ruff)
        working-directory: backend
        run: poetry run ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: poetry run mypy app/

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install

      - name: Unit tests
        working-directory: backend
        run: poetry run pytest -m unit --cov=app --cov-report=term-missing --cov-fail-under=0
        env:
          ENVIRONMENT: test

  backend-integration:
    name: Backend — Integration & Security Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: testpassword
        ports:
          - 8529:8529

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install

      - name: Wait for ArangoDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8529/_api/version > /dev/null 2>&1; then
              echo "ArangoDB ready after ${i} attempts"
              break
            fi
            sleep 3
          done

      - name: Integration tests
        working-directory: backend
        run: poetry run pytest -m "unit or integration or security" --cov=app --cov-report=xml
        env:
          ARANGO_URL: http://localhost:8529
          ARANGO_ROOT_PASSWORD: testpassword
          ARANGO_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  backend-openapi-drift:
    name: Backend — OpenAPI Schema Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Check docs/api/openapi.json is up to date
        working-directory: backend
        run: poetry run python scripts/export_openapi.py --check ../docs/api/openapi.json

  backend-security:
    name: Backend — Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Audit dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # Ignored vulnerabilities (tracked in chore/security-upgrades):
          # CVE-2026-3219, CVE-2026-6357, PYSEC-2026-196, PYSEC-2026-3721 — affect pip itself in the poetry venv, not a project dep
          # GHSA-537c-gmf6-5ccf — cryptography transitive dep; no fix path without breaking changes
          # PYSEC-2026-1325 — ecdsa transitive dep; no fix version published yet
          # PYSEC-2026-3628 — h2 transitive dep, hard-pinned at 4.3.0 by prowler across all 5.x (same pin pattern as its cryptography pin); a >=4.4.1 floor makes poetry resolution unsolvable
          PIPAPI_PYTHON_LOCATION=$(poetry env info --path)/bin/python pip-audit \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-3721 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-3628

  frontend-check:
    name: Frontend — Lint, Type Check & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests (Jest)
        working-directory: frontend
        run: npm run test -- --coverage --passWithNoTests

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  agent-check:
    name: Agent — Vet & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum

      - name: Go vet
        working-directory: agent
        run: |
          if [ -n "$(find . -name '*.go')" ]; then
            go vet ./...
          else
            echo "No Go source files yet — skipping vet"
          fi

      - name: Build
        working-directory: agent
        run: |
          if [ -n "$(find . -name '*.go')" ]; then
            go build ./...
          else
            echo "No Go source files yet — skipping build"
          fi
