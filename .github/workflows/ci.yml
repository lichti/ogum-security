name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Fast jobs (lint, unit tests, frontend, agent) run on every push to `dev` and `main`,
# and on every PR into `main`. Heavy jobs (Docker build, integration/security tests
# against real ArangoDB+Redis, OpenAPI drift, dependency audit) carry
# `if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'` so a
# push to `dev` (local feature branches merging in) skips them — the full matrix still
# runs once per batched dev → main PR. See ADR-014 in specs/architecture.md.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker — Compose Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/**', 'backend/pyproject.toml', 'frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Validate docker compose build
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1
          BUILDX_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          BUILDX_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

      # US-13.11 — docker run da imagem trivy pinada (o trivy-action 0.28
      # está quebrado upstream: delega a setup-trivy@v0.2.1, tag inexistente).
      # Scanners: vuln (CVE bloqueia). Segredos ficam no gitleaks (fonte,
      # blocking) — o scanner de secrets aponta falso positivo no texto de
      # exemplo do ConnectWizard embutido nos bundles .next.
      - name: "Trivy image scan — backend (US-13.11: CRITICAL bloqueia)"
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
          image --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed
          ogum-security-backend:latest

      - name: Trivy image scan — frontend
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
          image --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed
          ogum-security-frontend:latest

  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Lint (ruff)
        working-directory: backend
        run: poetry run ruff check .

      - name: Format check (ruff)
        working-directory: backend
        run: poetry run ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: poetry run mypy app/

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install

      - name: Unit tests
        working-directory: backend
        # US-13.10: piso honesto no unit — medido 49,94% (a cobertura pesada está
        # na integração, que herda o gate 80 do pyproject e mediu 86,60%).
        run: poetry run pytest -m unit --cov=app --cov-report=term-missing --cov-fail-under=45
        env:
          ENVIRONMENT: test

  backend-integration:
    name: Backend — Integration & Security Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: testpassword
        ports:
          - 8529:8529

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ogum-dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add IPC_LOCK

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install

      - name: Wait for ArangoDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8529/_api/version > /dev/null 2>&1; then
              echo "ArangoDB ready after ${i} attempts"
              break
            fi
            sleep 3
          done

      - name: Integration tests
        working-directory: backend
        run: poetry run pytest -m "unit or integration or security" --cov=app --cov-report=xml
        env:
          ARANGO_URL: http://localhost:8529
          ARANGO_ROOT_PASSWORD: testpassword
          ARANGO_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: ogum-dev-root
          ENVIRONMENT: test

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  backend-openapi-drift:
    name: Backend — OpenAPI Schema Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Check docs/api/openapi.json is up to date
        working-directory: backend
        run: poetry run python scripts/export_openapi.py --check ../docs/api/openapi.json

  backend-security:
    name: Backend — Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Configure Poetry virtualenv
        run: poetry config virtualenvs.in-project true
        working-directory: backend

      - name: Cache Poetry virtualenv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: poetry install --no-root

      - name: Audit dependencies
        working-directory: backend
        run: |
          # US-13.10: a ferramenta de audit é auditável — versão pinada
          pip install pip-audit==2.7.3
          # Ignored vulnerabilities (tracked in chore/security-upgrades):
          # CVE-2026-3219, CVE-2026-6357, PYSEC-2026-196, PYSEC-2026-3721 — affect pip itself in the poetry venv, not a project dep
          # GHSA-537c-gmf6-5ccf — cryptography transitive dep; no fix path without breaking changes
          # PYSEC-2026-1325 — ecdsa transitive dep; no fix version published yet
          # PYSEC-2026-3628 — h2 transitive dep, hard-pinned at 4.3.0 by prowler across all 5.x (same pin pattern as its cryptography pin); a >=4.4.1 floor makes poetry resolution unsolvable
          PIPAPI_PYTHON_LOCATION=$(poetry env info --path)/bin/python pip-audit \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-3721 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-3628

  frontend-check:
    name: Frontend — Lint, Type Check & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests (Jest)
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Type check & build
        working-directory: frontend
        run: npm run build


  secrets-scan:
    name: Security — Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Gitleaks (US-13.11)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-validation:
    name: IaC — Terraform/CFN/K8s Validation & Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Harden Runner (US-13.04 — egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: CloudFormation lint (US-13.01)
        run: |
          pip install cfn-lint==1.22.1
          cfn-lint infra/iam/*.cfn.yml

      - name: Terraform fmt & validate (US-13.01)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform validate
        working-directory: infra/iam
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: tflint (W4.5)
        uses: terraform-linters/setup-tflint@v4

      - name: tflint run
        working-directory: infra/iam
        run: |
          tflint --init
          tflint --recursive

      - name: DaemonSet manifest validation (kubeconform — 100% client-side;
          kubectl dry-run tenta API discovery e exige cluster)
        run: |
          docker run --rm -v "$PWD/infra/k8s:/_manifests" \
            ghcr.io/yannh/kubeconform:v0.6.7 -strict /_manifests/ogum-scanner-daemonset.yaml

      - name: Checkov sobre a própria IaC (US-13.11 — warning até o próximo ciclo)
        run: |
          pip install checkov==3.2.373
          checkov -d infra/ --framework terraform,cloudformation,kubernetes --soft-fail --quiet
