name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker — Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker compose build
        run: docker compose build --no-cache
        env:
          DOCKER_BUILDKIT: 1

  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-root

      - name: Lint (ruff)
        working-directory: backend
        run: poetry run ruff check .

      - name: Format check (ruff)
        working-directory: backend
        run: poetry run ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: poetry run mypy app/

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        working-directory: backend
        run: poetry install

      - name: Unit tests
        working-directory: backend
        run: poetry run pytest -m unit --cov=app --cov-report=term-missing --cov-fail-under=0
        env:
          ENVIRONMENT: test

  backend-integration:
    name: Backend — Integration & Security Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: testpassword
        ports:
          - 8529:8529

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        working-directory: backend
        run: poetry install

      - name: Wait for ArangoDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8529/_api/version > /dev/null 2>&1; then
              echo "ArangoDB is ready"
              break
            fi
            echo "Waiting for ArangoDB... ($i/30)"
            sleep 5
          done

      - name: Integration tests
        working-directory: backend
        run: poetry run pytest -m "integration or security" --cov=app --cov-report=xml
        env:
          ARANGO_URL: http://localhost:8529
          ARANGO_ROOT_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  backend-security:
    name: Backend — Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-root

      - name: Audit dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # Ignored vulnerabilities (tracked in chore/security-upgrades):
          # CVE-2026-3219, CVE-2026-6357, PYSEC-2026-196 — affect pip (CI runner, not a project dep)
          # GHSA-537c-gmf6-5ccf — cryptography transitive dep; no fix path without breaking changes
          # GHSA-gr75-jv2w-4656, PYSEC-2026-77 — langchain/langchain-text-splitters; fix requires
          #   1.x which does not exist on PyPI — tracked for upgrade when available
          PIPAPI_PYTHON_LOCATION=$(poetry env info --path)/bin/python pip-audit \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln GHSA-gr75-jv2w-4656 \
            --ignore-vuln PYSEC-2026-77

  frontend-check:
    name: Frontend — Lint, Type Check & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests (Jest)
        working-directory: frontend
        run: npm run test -- --coverage --passWithNoTests

      - name: Type check & build
        working-directory: frontend
        run: npm run build

  agent-check:
    name: Agent — Vet & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum

      - name: Go vet
        working-directory: agent
        run: |
          if [ -n "$(find . -name '*.go')" ]; then
            go vet ./...
          else
            echo "No Go source files yet — skipping vet"
          fi

      - name: Build
        working-directory: agent
        run: |
          if [ -n "$(find . -name '*.go')" ]; then
            go build ./...
          else
            echo "No Go source files yet — skipping build"
          fi
